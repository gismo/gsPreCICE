name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorials:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out G+Smo v26.09.0
        uses: actions/checkout@v4
        with:
          repository: gismo/gismo
          ref: 0cf223f37f1ccb367dd7253937cee01c22ef881e
          path: gismo

      - name: Check out adapter under test
        uses: actions/checkout@v4
        with:
          path: gismo/optional/gsPreCICE

      - name: Check out gsElasticity
        uses: actions/checkout@v4
        with:
          repository: gismo/gsElasticity
          ref: 48967e96d7c38ec84df62f6cedae275c11a75570
          path: gismo/optional/gsElasticity

      - name: Check out gsStructuralAnalysis
        uses: actions/checkout@v4
        with:
          repository: gismo/gsStructuralAnalysis
          ref: b5ec8536ac43063003d31f75b5d563dffd2896bf
          path: gismo/optional/gsStructuralAnalysis

      - name: Check out preCICE v3.2.0
        uses: actions/checkout@v4
        with:
          repository: precice/precice
          ref: v3.2.0
          path: precice

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libeigen3-dev libxml2-dev libboost-all-dev libopenmpi-dev openmpi-bin python3

      - name: Build and install preCICE
        run: |
          cmake -S precice -B precice-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/precice-install" \
            -DBUILD_TESTING=OFF \
            -DPRECICE_FEATURE_MPI_COMMUNICATION=ON \
            -DPRECICE_FEATURE_PETSC_MAPPING=OFF \
            -DPRECICE_FEATURE_PYTHON_ACTIONS=OFF \
            -DPRECICE_CONFIGURE_PACKAGE_GENERATION=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build precice-build --parallel 2
          cmake --install precice-build

      - name: Build both G+Smo tutorials with C++11
        run: |
          cmake -S gismo -B gismo-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=11 \
            -DGISMO_BUILD_LIB=ON \
            '-DGISMO_OPTIONAL=gsElasticity;gsStructuralAnalysis;gsPreCICE' \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/precice-install" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build gismo-build --parallel 2 --target partitioned-heat-conduction perpendicular-flap-vertex-gismo
